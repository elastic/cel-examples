rules:
  - path: /testoauth/token
    methods: [POST]
    query_params:
      grant_type: client_credentials
    request_headers:
      Content-Type:
        - application/x-www-form-urlencoded
      Authorization:
        - "Basic YW1pdXNlcjphbWlwYXNzd29yZA=="
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: |-
          {"access_token": "testaccess","token_type": "Bearer","expires_in": 172799,"refresh_token": "testrefresh"}
  - path: /test/api/booking
    methods: [GET]
    query_params:
      cursor: a1b2
      limit: 2
    request_headers:
      Authorization: "Bearer testaccess"
    responses:
      - status_code: 200
        body: |-
          {{ minify_json `
          {
            "data":[
              {
                "id":"ab5af2c-f477-43c4-8bdf-a00bdb939d65",
                "trip_id":"ab67459c-af07-40bb-bb12-178dbb88e09f",
                "passenger_name":"John Apple"
              },
              {
                "id":"ef25ff48-ab45-4bb5-9d02-88745177dedb",
                "trip_id":"ab123456-af07-40bb-bb12-178dbb88e09f",
                 "passenger_name":"Jane Artichoke"
              }
            ],
            "links":{
              "self":"a1b2",
              "next":"a2b2"
            }
          }`
          }}
