version: "2.3"
services:
  request_body_id_timestamp_filter:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: request_body_id_timestamp_filter
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config.yml
