title: Request Body ID Timestamp Filter
type: logs
streams:
  - input: cel
    title: Request Body ID Timestamp Filter
    description: Collect booking history with POST body time windows and ID filters.
    template_path: cel.yml.hbs
    vars:
      - name: url
        type: url
        title: URL
        description: Base URL for the example API.
        required: true
        show_user: true
        multi: false
        default: http://localhost:8090/test/api
      - name: interval
        type: text
        title: Interval
        description: Duration between requests to the API.
        required: true
        show_user: true
        multi: false
        default: 1m
      - name: batch_size
        type: integer
        title: Batch Size
        description: Maximum records to request per page.
        required: true
        show_user: false
        multi: false
        default: 2
      - name: sub_path
        type: text
        title: Sub Path
        description: API path below the shared URL.
        required: true
        show_user: false
        multi: false
        default: booking/history
      - name: initial_interval
        type: text
        title: Initial Interval
        description: How far back to query on first run.
        required: true
        show_user: true
        multi: false
        default: 24h
      - name: user
        type: text
        title: Username
        description: Username for manual Basic auth.
        required: true
        show_user: true
        multi: false
        default: amiuser
      - name: password
        type: password
        title: Password
        description: Password for manual Basic auth.
        required: true
        show_user: true
        secret: true
        multi: false
        default: amipassword
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: The request tracer logs requests and responses to the agent's local file-system for debugging.
        required: false
        show_user: false
        multi: false
        default: false
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event in event.original.
        required: false
        show_user: true
        multi: false
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags for the data stream.
        required: false
        show_user: false
        multi: true
        default:
          - forwarded
          - cel_examples-request_body_id_timestamp_filter
      - name: processors
        type: yaml
        title: Processors
        description: Processors to apply before ingest pipelines.
        required: false
        show_user: false
        multi: false
