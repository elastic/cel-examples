version: "2.3"
services:
  url_query_basic_auth_manual_next_link:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: url_query_basic_auth_manual_next_link
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config.yml
