rules:

  - path: /test/api/booking
    methods: [GET]
    query_params:
      page: 1
      limit: 2
    request_headers:
      Authorization: "Basic YW1pdXNlcm5hbWU6YW1pcGFzc3dvcmQ="
    responses:
      - status_code: 200
        body: |-
          {{ minify_json `
          {
            "data": [
              {
                "id": "ab5af2c-f477-43c4-8bdf-a00bdb939d65",
                "trip_id": "ab67459c-af07-40bb-bb12-178dbb88e09f",
                "passenger_name": "John Apple"
              },
              {
                "id": "ef25ff48-ab45-4bb5-9d02-88745177dedb",
                "trip_id": "ab123456-af07-40bb-bb12-178dbb88e09f",
                "passenger_name": "Jane Artichoke"
              }
            ],
            "links": {
              "self": "/booking?page=1",
              "next": "/booking?page=2"
            }
          }
          `}}

  - path: /test/api/booking
